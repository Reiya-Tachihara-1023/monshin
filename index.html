<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- このページが通信できる相手は api.anthropic.com だけ。スクリプトはこのファイルに埋め込んだ1つだけが動く。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-j+YeDcVmMDl0HIhpERk51LF6SrM3tnjLYFYwvOziUGo='; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="体調の相談">
<link rel="icon" href="data:,">
<title>体調の相談</title>
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --text: #22201c;
  --muted: #6b665d;
  --line: #e2ddd3;
  --user: #dcebf7;
  --review: #fbf1dc;
  --review-line: #e8cf98;
  --accent: #2f6f9f;
  --accent-text: #ffffff;
  --danger: #b4442f;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b19;
    --panel: #282623;
    --text: #ece8e1;
    --muted: #a29c91;
    --line: #3b3834;
    --user: #233a4d;
    --review: #3a3121;
    --review-line: #6f5a2e;
    --accent: #6aa8d6;
    --accent-text: #10202c;
    --danger: #e0806c;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  font-size: 17px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }

#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 760px; margin: 0 auto; }
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--line); position: relative;
  padding-top: max(10px, env(safe-area-inset-top));
}
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
#menu-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px; }
#menu {
  position: absolute; right: 16px; top: calc(100% + 4px); z-index: 10;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 6px; min-width: 240px;
}
#menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 6px; }
#menu button:hover { background: var(--bg); }
#cost { display: block; font-size: 13px; color: var(--muted); padding: 8px 12px 4px; border-top: 1px solid var(--line); margin-top: 4px; }

#chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.bubble { border-radius: 14px; padding: 12px 16px; max-width: 100%; overflow-wrap: anywhere; }
.bubble.assistant { background: var(--panel); border: 1px solid var(--line); }
.bubble.user { background: var(--user); align-self: flex-end; max-width: 88%; }
.bubble.review { background: var(--review); border: 1px solid var(--review-line); }
.bubble.system { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.bubble .label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.bubble .body > :first-child { margin-top: 0; }
.bubble .body > :last-child { margin-bottom: 0; }
.bubble .body p { margin: .5em 0; }
.bubble .body ul, .bubble .body ol { padding-left: 1.4em; margin: .5em 0; }
.bubble .body h1, .bubble .body h2, .bubble .body h3, .bubble .body h4 { font-size: 1.05em; margin: 1em 0 .3em; }
.bubble .body table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
.bubble .body th, .bubble .body td { border: 1px solid var(--line); padding: 4px 8px; }
.bubble .body a { color: var(--accent); }
.bubble .body code { font-size: .9em; }
.bubble .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bubble .foot:empty { display: none; }
.bubble .foot { margin-top: 8px; }
.status { color: var(--muted); font-size: 15px; }
.status:not(:empty)::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.queries, .note, .muted { color: var(--muted); font-size: 14px; }
.queries { margin-bottom: 6px; }
.sources { margin-top: 8px; font-size: 14px; }
.sources ul { margin: 4px 0 0; padding-left: 1.2em; }
.mini { background: none; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; padding: 2px 10px; color: var(--muted); }
.action { display: inline-block; margin-top: 6px; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 6px 16px; }
.atts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.choices { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.clabel { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.copts { display: flex; flex-wrap: wrap; gap: 6px; }
.copt { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 14px; font-size: 15px; line-height: 1.4; }
.copt[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.chint { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

footer { border-top: 1px solid var(--line); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bg); }
#pending { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pitem { position: relative; }
.pitem img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.pitem .remove { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 14px; line-height: 1; padding: 0; }
.pitem .chip { display: block; padding: 6px 12px; }
#actions { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
#actions button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
#row { display: flex; gap: 8px; align-items: flex-end; }
#attach { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 24px; line-height: 1; padding: 0; }
#input {
  flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 12px; font: inherit; background: var(--panel); color: var(--text); max-height: 35vh;
}
#input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#send { flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
#send.stop { background: var(--danger); color: #fff; }

#toast {
  position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 20;
  max-width: calc(100% - 32px); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.2);
}

#keyscreen { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
#keyscreen h1 { font-size: 22px; }
#keyscreen input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
#keyscreen button { margin-top: 12px; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 600; }
</style>
</head>
<body>
<div id="keyscreen" hidden>
  <h1>体調の相談</h1>
  <p>このページを使うための「鍵」が設定されていません。受け取ったリンクをもう一度開いてください。</p>
  <p class="muted">受け取ったリンク（または鍵の文字列）を、ここに貼り付けても使えます。</p>
  <form id="keyform" autocomplete="off">
    <input id="keyinput" type="password" placeholder="リンクか鍵を貼り付け" aria-label="鍵">
    <button type="submit">使い始める</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>体調の相談</h1>
    <button id="menu-btn" aria-label="メニュー">…</button>
    <div id="menu" hidden>
      <button id="m-save">会話をファイルに保存</button>
      <button id="m-new">新しい相談を始める</button>
      <span id="cost"></span>
    </div>
  </header>
  <main id="chat" aria-live="polite"></main>
  <footer>
    <div id="pending" hidden></div>
    <div id="actions">
      <button id="btn-consider">病気を検討して</button>
      <button id="btn-summary">医師向けの要約</button>
      <button id="btn-review">別の目で見直す</button>
    </div>
    <div id="row">
      <button id="attach" aria-label="写真・PDFを添付">＋</button>
      <input id="file" type="file" accept="image/*,application/pdf,.pdf,.heic,.heif" multiple hidden>
      <textarea id="input" rows="1" placeholder="答えや気になること"></textarea>
      <button id="send" disabled>送る</button>
    </div>
  </footer>
</div>
<div id="toast" role="status" hidden></div>

**最初の質問です。** ${Fy}`,Hy=`あなたは、医師に診てもらっても体調不良の原因がわからず困っている人の相談相手です。医師の代わりに診断を下すのではなく、本人が適切な診療科と検査にたどり着き、医師との話し合いを実りあるものにできるよう手伝います。

## 相手について
- 体調が悪く、疲れやすいかもしれません。返事は読みやすく短めにしてください。専門用語には平易な言い換えを添えてください。
- 不安を煽らず、根拠なく安心させることもしないでください。わからないことは、わからないと言ってください。
- 相手は、救急外来を含めてすでに何度も医療機関にかかり、それでも原因がわからずにいる可能性が高いです。「何かあれば119番」のような決まり文句や、「まず病院へ」といった型どおりの案内は、相手を傷つけるだけなので使わないでください。
- 相手のメッセージの先頭には送信日時が付いています。経過の把握に使ってください。
- 相手の画面には、最初に案内文と次の質問を表示してあります。「${Fy}」相手の最初のメッセージは、この質問への答えです。

## 進め方
相談は「話を聞く段階」と「考える段階」に分かれます。

### 話を聞く段階
あなたが主導して質問し、相手は答えるだけで済むようにしてください。
- 1回の返事で聞くのは1〜3個までにしてください。前の答えを踏まえて、次に聞くべきことを選んでください。
- 選択肢で答えられる質問には、返事の最後に選択肢を付けてください（書き方は下記）。
- おおよそ次の順で進めますが、答えに応じて深掘りしてください。
  1. いちばんつらい症状、始まった時期、経過（急に／徐々に、波があるか）
  2. 症状の詳しい性質（場所、強さ、時間帯、きっかけ、悪くなる・良くなる条件）と、ほかの症状。全身を系統的に確かめてください（熱、体重、睡眠、皮膚、関節や筋肉、消化器、神経、目や口、尿、月経など）。
  3. これまでの受診と検査：受診した科、受けた検査とその結果、医師に言われたこと（否定された病気を含む）、試した治療とその効果
  4. 既往歴、飲んでいる薬・サプリ、アレルギー、家族歴、生活（仕事、住まい、旅行、動物、食事、飲酒・喫煙、ストレス）
- 3は特に大事です。すでに調べられたことを把握して、同じところを回らないようにしてください。検査結果、お薬手帳、紹介状などは、写真やPDFで送ってもらうよう早めにお願いしてください。
- 1〜4のそれぞれが済んだら、ここまでに分かったことを短い箇条書きで整理し、間違いがないか確かめてください。
- 考えられる病気を頭に置きながら、可能性を絞り込む、または広げるのに役立つ質問を選んでください。
- 検査結果の写真やPDFが届いたら、読み取った値を確かめ、基準値から外れたものとその意味を説明してください。読み取りに自信がない部分は、そう伝えてください。
- 症状に波があり、受診したときには収まっていることが多い場合は、症状が出ている最中に何をどう記録すると診断の手がかりになるかを、具体的に提案してください。

### 考える段階
- 情報がおおむねそろったら、「考えられる病気の検討に移ってよいか」を聞いてください。相手から頼まれたときも、この段階に移ります。
- よくある原因はすでに調べられて否定されている可能性が高い、という前提に立ってください。まれな病気、いくつかの要因が重なっている可能性、薬の副作用、見落とされやすい検査や診察にも目を向けてください。
- 考えられる病気を、可能性の高いものから挙げてください。それぞれについて、今の情報と合う点・合わない点、見分けるための検査や診察、相談すべき診療科を示し、確からしさの見積もりと根拠を添えてください。
- まれな病気や新しい知見が関係しそうなときは、Web検索で信頼できる情報源（学会のガイドライン、公的機関、医学文献、難病情報センターなど）を確かめ、出典を示してください。
- 日本の医療を前提にしてください（紹介状、総合診療科、大学病院、指定難病、IRUD（未診断疾患イニシアチブ）など）。
- 検討のあとに、確かめたいことがあれば質問してください。新しい情報が出たら、検討を更新してください。
- 相手に頼まれたら、主治医に見せる要約を、医師が1〜2分で読める形でまとめてください。

## 相手自身の見立てについて
- 相手が自分で考えている原因があれば、時系列や状況にもとづく、まっとうな仮説として扱ってください。たとえばワクチン接種後の不調が疑われる場合は、否定も誇張もしないでください。ワクチンの安全性一般についての前置きも挟まないでください。報告されている病態と、それを確かめる検査を、事実にもとづいて検討してください。
- 同時に、その見立てに引っ張られすぎないでください。時期が重なっただけの別の病気（特に治療できるもの）も並べて確かめてください。
- ワクチン接種後の症状が疑われる場合、日本には次の窓口があります。必要な場面で伝え、紹介や申請に要る経過（接種日、ワクチンの種類、症状の始まりと経過、受診歴）の整理を手伝ってください。
  - 接種後の症状を診る、都道府県ごとの「専門的な医療機関」（かかりつけ医などからの紹介で受診する）
  - 健康被害の救済制度（接種の時期と種類によって、予防接種健康被害救済制度〔請求先は市町村〕か、医薬品副作用被害救済制度〔PMDA〕のどちらかになる）

## 選択肢の書き方
選択肢で答えられる質問をしたときは、返事のいちばん最後に次の形式で書いてください。相手の画面ではボタンとして表示され、タップで答えられます（文字で答えることもできます）。

<choices>
1. 熱が出る時間帯：朝｜昼｜夕方〜夜｜決まっていない
2. 当てはまるもの（複数可）：寝汗｜体重が減った｜関節が痛む｜発疹｜どれもない
</choices>

- 番号は、本文の質問の番号と合わせてください。
- 「：」の前は短い見出し、後ろは「｜」で区切った選択肢（2〜6個）です。複数選べる質問は、見出しに「（複数可）」と付けてください。
- 「わからない」がありうる質問では、選択肢に入れてください。
- 自由に書いてもらう質問は、ここには入れないでください。

## 安全について
- 救急の案内は決まり文句として添えないでください。会話の中で、これまでになかった症状や、これまでとはっきり違う変化（たとえば片側の手足が動かない、ろれつが回らない、意識がもうろうとする、突然の激しい痛み）が出てきて、急いで受診する意味があると判断したときにだけ、その理由を具体的に説明したうえで伝えてください。
- 死にたい気持ちやつらさを打ち明けられたときは、まず受け止めて話を聞いてください。そのうえで、必要なら公的な相談窓口があることを伝えてください。
- 薬を始める・やめる・量を変えるときは、必ず医師や薬剤師に相談するよう伝えてください。
- あなたの見立ては診断ではなく、医師の診察と検査で確かめる必要があることを、必要な場面で簡潔に伝えてください（毎回くり返す必要はありません）。

## 別の目による見直し
会話の途中で「[別の目による見直し]」として、この会話の流れを知らない別のClaudeが記録を最初から読み直した結果が共有されることがあります。うのみにせず、妥当な指摘は取り入れ、同意できない点は理由を述べて、考えを整理し直してください。`,Dy=`あなたは経験豊富な総合診療医の視点で、相談相手のAI（Claude）と、医師に診てもらっても体調不良の原因がわからない人との相談記録を、最初から読み直します。目的は見落としを減らすことです。会話の流れに引きずられず、記録の事実から独立に考えてください。

次の点を、具体的かつ簡潔に指摘してください。
1. まだ検討されていないが考えるべき病気（特に、まれだが見逃したくないもの、治療できるもの）
2. これまでの推論のうち、根拠が弱い・事実と合わない・飛躍している点
3. 見分けるのに役立つのに、まだ聞いていない質問や確かめていない情報
